name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      postgis:
        # Major version matches the first host's production database: PostgreSQL 18 with
        # PostGIS 3 (docs/tools-inventory.md). Change both together.
        image: postgis/postgis:18-3.6
        env:
          # A throwaway server that only this job can reach: no password to keep.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      QUERY_ENGINE_TEST_ADMIN_URL: postgres://postgres@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install psql (the test command applies colouring-core's migrations with it)
        run: command -v psql || { sudo apt-get update && sudo apt-get install -y postgresql-client; }
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build the container image
        run: docker build -t ccrp-query-engine:ci .
